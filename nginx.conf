# ─── Redirect all HTTP to HTTPS ───────────────────────────────────────────────
server {
    listen 80;
    server_name games.henrywalters.dev hascape-api.henrywalters.dev hascape-server.henrywalters.dev;
    return 301 https://$host$request_uri;
}

# ─── games.henrywalters.dev ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name games.henrywalters.dev;

    ssl_certificate     /etc/letsencrypt/live/games.henrywalters.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.henrywalters.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://hagameonline_frontend:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── hascape-api.henrywalters.dev ────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name hascape-api.henrywalters.dev;

    ssl_certificate     /etc/letsencrypt/live/hascape-api.henrywalters.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hascape-api.henrywalters.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://hascape_api:4201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── hascape-server.henrywalters.dev ─────────────────────────────────────────
server {
    listen 443 ssl;
    server_name hascape-server.henrywalters.dev;

    ssl_certificate     /etc/letsencrypt/live/hascape-server.henrywalters.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hascape-server.henrywalters.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # HTTP
    location / {
        proxy_pass http://hascape_game:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
 
    # Secure WebSocket (wss://)
    location /ws {
        proxy_pass http://hascape_game:4200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}